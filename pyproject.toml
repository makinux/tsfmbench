[project]
name = "tsfmbench"
version = "0.1.0"
description = "TimesFM 3.0 financial-practice benchmark: zero-shot FM vs practical baselines on financial market data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "timesfm[torch]==3.0.0",
    "torch==2.9.1",
    "statsforecast==2.1.1",
    "mlforecast==1.1.0",
    "utilsforecast==0.2.16",
    "lightgbm==4.7.0",
    "arch==8.0.0",
    "pandas>=2.2",
    "numpy>=2.1",
    "pyarrow>=17",
    "scipy>=1.13",
    "requests>=2.32",
    "tenacity>=8.5",
    "typer>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "truststore>=0.9",
]

[project.optional-dependencies]
reference = [
    "prophet==1.4.0",
]

[project.scripts]
tsfmbench = "tsfmbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
# Some networks perform TLS inspection; trust the OS certificate store.
system-certs = true
# uv's python-build-standalone interpreters hard-crash on TLS on this machine
# (OPENSSL_Applink); require the python.org build installed via winget.
python-preference = "only-system"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsfmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -p no:cacheprovider"
markers = [
    "slow: requires a real checkpoint, GPU, network, or a deliberately expensive integration run",
]

[tool.ruff]
line-length = 100
target-version = "py312"
